name: ai_pdf
description: AI-powered PDF editor and form filler
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (multi-language UI). The intl version is governed by
  # flutter_localizations to avoid version-solve conflicts.
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0

  # Networking (online AI features only)
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Storage
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  # Version intentionally unpinned so it resolves to whatever
  # flutter_localizations requires (prevents pub version-solve failures).
  intl: any

  # File selection (choose, not upload)
  # file_picker 8.x fixes the AGP 8 namespace build error present in 6.x
  file_picker: ^8.1.6
  image_picker: ^1.1.2

  # OFFLINE document tools (all work on-device, no network)
  # pdfx: PDFium-based rendering with EXPLICIT width/height control, so page
  # rasters are capped in size -> bounded memory -> no OutOfMemoryError.
  # It also provides a memory-efficient pinch-zoom viewer (PdfViewPinch).
  # Exact pin. pdfx 2.10+ calls Matrix4.translateByDouble / scaleByDouble,
  # which need vector_math 2.2. Flutter 3.29 (CI) only ships vector_math
  # 2.1.4, so a caret on 2.6 floats to 2.11 and assembleRelease fails.
  # 2.9.2 is the last release that matches the Flutter pin in
  # .github/workflows/build-apk.yml.
  pdfx: 2.9.2             # Render (capped) + pro pinch viewer
  pdf: ^3.11.1             # Create output PDFs (JPG to PDF, merge, split)
  image: ^4.3.0            # Image compress/downscale (pure Dart, offline)

  # UI helpers
  share_plus: ^10.1.2      # Share exported files

  # Runtime permissions (storage / photos-gallery / camera)
  permission_handler: ^11.3.1

  # Monetization: Google Play Billing (subscriptions + one-time lifetime).
  # Digital goods MUST use Play Billing per Play policy.
  in_app_purchase: ^3.2.0

  # On-device OCR (offline text recognition; bundled ML Kit model, API 21+).
  # Range (not caret) so pub resolves the newest 0.x that supports the current
  # Flutter/AGP toolchain.
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'

  # On-device text-to-speech for the Read Aloud reading tool (uses the system
  # TTS engine; no network, no extra permissions).
  flutter_tts: ^4.2.0

  # Ads (free tier only; removed for Pro). Includes the UMP consent SDK.
  google_mobile_ads: ^5.1.0
  pointycastle: ^4.0.0
  crypto: ^3.0.6
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  # Bundled SIL OFL 1.1 fonts (see assets/fonts/README.md). PdfUnicodeFonts
  # loads them by path for vector text in exported PDFs; the families below
  # make the on-screen preview use the same faces the export embeds.
  assets:
    - assets/fonts/
    - assets/fonts/licenses/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: NotoSansHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/NotoSansHebrew-Bold.ttf
          weight: 700
