name: ai_pdf
description: AI-powered PDF editor and form filler
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0

  # Networking (online AI features only)
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Storage
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # File selection (choose, not upload)
  # file_picker 8.x fixes the AGP 8 namespace build error present in 6.x
  file_picker: ^8.1.6
  image_picker: ^1.1.2

  # OFFLINE document tools (all work on-device, no network)
  pdf: ^3.11.1              # Create PDFs offline (JPG to PDF)
  printing: ^5.13.3        # Preview, save, share PDFs offline
  image: ^4.3.0            # Image compress/resize (pure Dart, offline)
  syncfusion_flutter_pdf: ^27.2.17  # PDF merge/split/compress offline (pure Dart)

  # UI helpers
  share_plus: ^10.1.2      # Share exported files

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
