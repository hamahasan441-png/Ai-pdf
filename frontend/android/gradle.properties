org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Safety: silence AGP's "tested up to compileSdk 35" notice now that the app
# compiles against 36 (required by flutter_tts ^4.2.0). AGP 8.7.0 builds
# against 36 correctly — this only suppresses the advisory warning.
android.suppressUnsupportedCompileSdk=36
