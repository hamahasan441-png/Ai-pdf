plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ---------------------------------------------------------------------------
// Release signing (optional, non-breaking).
// If android/key.properties exists we sign the release build with the real
// upload/release keystore. If it does NOT exist (e.g. CI without secrets, or a
// fresh clone) we fall back to the debug key so `flutter build apk` still works.
// Never commit key.properties or the .jks file — add them via CI secrets.
//
// key.properties format:
//   storeFile=upload-keystore.jks
//   storePassword=****
//   keyAlias=upload
//   keyPassword=****
// ---------------------------------------------------------------------------
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.aidocassistant.app"
    compileSdk = 36
    // Pinned: several plugins (ML Kit, pdfx, secure_storage, etc.) require
    // NDK 27; use the highest requested version (backward compatible).
    ndkVersion = "27.0.12077973"

    compileOptions {
        // Core library desugaring: required by printing/pdf & Java 8 APIs
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.aidocassistant.app"
        minSdk = 24
        // Google Play requires targetSdk 35 for new apps and updates (2025).
        targetSdk = 35
        // Driven by pubspec `version: x.y.z+BUILD`. CI passes --build-number to
        // auto-increment BUILD so every Play upload has a unique versionCode.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Real release signing when a keystore is configured; otherwise
            // debug signing so CI / local builds keep working.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // R8 shrink + obfuscate: smaller APK, harder to reverse-engineer.
            // Keep rules for reflection-heavy plugins live in proguard-rules.pro.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 2.0.4 is the version this project last built cleanly with.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // PDF Import Engine dependencies
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
