plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.aidocassistant.app"
    compileSdk = 35
    // Pinned: several plugins (ML Kit, pdfx, secure_storage, etc.) require
    // NDK 27; use the highest requested version (backward compatible).
    ndkVersion = "27.0.12077973"

    compileOptions {
        // Core library desugaring: required by printing/pdf & Java 8 APIs
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.aidocassistant.app"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // Keep minification OFF so plugin classes are never stripped
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 2.0.4 is the version this project last built cleanly with.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
