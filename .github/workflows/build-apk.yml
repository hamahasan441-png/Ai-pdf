name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Setup Android project
        working-directory: frontend
        run: |
          flutter create --project-name ai_pdf --org com.aidocassistant --platforms android .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml || true
          git checkout -- android/app/src/main/AndroidManifest.xml || true
          git checkout -- android/app/build.gradle || true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: AI-PDF-Release
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
