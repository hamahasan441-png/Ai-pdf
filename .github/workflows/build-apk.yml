name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Create Flutter project scaffolding
        working-directory: frontend
        run: |
          flutter create --project-name ai_pdf --org com.aidocassistant --platforms android .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml
          git checkout -- android/app/src/main/AndroidManifest.xml
          git checkout -- android/app/build.gradle
          git checkout -- android/build.gradle
          git checkout -- android/settings.gradle
          git checkout -- android/gradle.properties
          git checkout -- android/gradle/wrapper/gradle-wrapper.properties
          git checkout -- android/app/src/main/kotlin/
          git checkout -- android/app/src/main/res/

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-pdf-release
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
