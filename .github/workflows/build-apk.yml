name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Generate missing platform files
        working-directory: frontend
        run: |
          # flutter create fills in gitignored files (local.properties, etc.)
          # It won't overwrite committed files, but we restore ours anyway to be safe.
          flutter create --project-name ai_pdf --org com.aidocassistant --platforms android .
          git checkout -- lib/ pubspec.yaml analysis_options.yaml || true
          git checkout -- android/ || true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend
        # OPENROUTER_API_KEY is optional. Add it under
        # Settings -> Secrets and variables -> Actions to bake AI into the APK.
        # If unset, the app still works and you can paste your key in-app.
        run: >
          flutter build apk --release
          --dart-define=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}"

      - name: Rename APK
        working-directory: frontend
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AI-PDF.apk

      # Always keep the artifact (useful for PR builds).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-PDF-Release
          path: frontend/build/app/outputs/flutter-apk/AI-PDF.apk
          if-no-files-found: error
          retention-days: 90

      # On main: publish a Release so the APK has a permanent, no-login,
      # direct download link that works straight from a phone browser:
      #   https://github.com/<owner>/<repo>/releases/latest/download/AI-PDF.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI PDF (build ${{ github.run_number }})
          make_latest: true
          files: frontend/build/app/outputs/flutter-apk/AI-PDF.apk
          body: |
            **AI PDF — ready to install on your phone.**

            1. On your Android phone, tap **AI-PDF.apk** below to download.
            2. Open the downloaded file. If asked, allow "Install unknown apps".
            3. Done — open AI PDF. All file tools work offline, no login needed.

            Latest direct link (always newest build):
            `https://github.com/${{ github.repository }}/releases/latest/download/AI-PDF.apk`
