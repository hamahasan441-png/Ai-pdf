name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create Flutter project files
        working-directory: frontend
        run: |
          # Generate missing Flutter project files (like local.properties)
          flutter create --project-name ai_pdf_frontend --org com.aidocassistant --platforms android .
          # Restore our custom files that flutter create might overwrite
          git checkout -- lib/ pubspec.yaml analysis_options.yaml android/app/src/main/AndroidManifest.xml android/app/build.gradle android/app/src/main/kotlin/ android/app/proguard-rules.pro android/app/src/main/res/ android/gradle.properties 2>/dev/null || true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze code
        working-directory: frontend
        run: flutter analyze --no-fatal-warnings || true

      - name: Build APK (Release)
        working-directory: frontend
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Split APKs (smaller per architecture)
        working-directory: frontend
        run: flutter build apk --split-per-abi --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-assistant-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-doc-assistant-split-apks
          path: frontend/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: warn
