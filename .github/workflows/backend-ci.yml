name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static quality gate for the FastAPI backend. Intentionally dependency-free
  # (no pip install, no DB, no secrets) so it is fast and always reliable.
  # It catches the exact bug classes that previously slipped in:
  #   - misplaced route decorators / undefined names (pyflakes F82x)
  #   - unused imports (F401)
  #   - duplicated dict keys that silently drop values (F601)
  #   - syntax errors (py_compile)
  static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff==0.6.9

      # Pyflakes rules only: real correctness issues, not style opinions.
      - name: Ruff (pyflakes) — undefined names, unused imports, dup keys
        run: ruff check app --select F

      # Compile-smoke every module: guarantees there are no syntax errors.
      - name: py_compile all modules
        run: python -m compileall -q app
